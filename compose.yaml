services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hoh-local-mysql}
      MYSQL_ROOT_HOST: "%"
    command: ["--collation-server=utf8mb4_0900_bin", "--default-storage-engine=InnoDB"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" -Nse 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
